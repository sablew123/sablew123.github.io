<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SablewHUB</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Papyrus, "Segoe Print", fantasy;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(160deg, #d8c48a 0%, #cdb377 35%, #c2a768 65%, #b6995a 100%);
    color: #3a2e1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* textura tipo papiro con manchas */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(90,60,20,0.08) 0, transparent 12%),
      radial-gradient(circle at 80% 15%, rgba(90,60,20,0.06) 0, transparent 15%),
      radial-gradient(circle at 30% 80%, rgba(90,60,20,0.07) 0, transparent 14%),
      radial-gradient(circle at 70% 70%, rgba(90,60,20,0.05) 0, transparent 16%),
      repeating-linear-gradient(90deg, rgba(90,60,20,0.03) 0px, transparent 2px, transparent 4px);
    pointer-events: none;
  }

  h1 {
    font-size: 3rem;
    margin: 0 0 4px;
    letter-spacing: 2px;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.3), 2px 2px 4px rgba(90,60,20,0.4);
    color: #4a3a1a;
    text-align: center;
  }

  .subtitulo {
    font-size: 1.3rem;
    color: #5c4a26;
    margin: 0 0 40px;
    text-align: center;
  }

  .tarjetas {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: center;
    max-width: 900px;
    width: 100%;
  }

  .tarjeta {
    background: rgba(255, 248, 225, 0.55);
    border: 2px solid #7a5c2e;
    border-radius: 10px;
    padding: 28px 22px;
    width: 220px;
    text-align: center;
    text-decoration: none;
    color: #3a2e1a;
    box-shadow: 3px 3px 8px rgba(60,40,10,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .tarjeta:hover {
    transform: translateY(-4px) rotate(-0.5deg);
    box-shadow: 5px 6px 14px rgba(60,40,10,0.35);
  }

  .icono-wrap {
    width: 90px;
    height: 90px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tarjeta h2 {
    font-size: 1.15rem;
    margin: 0;
    letter-spacing: 0.5px;
  }

  /* icono micrófono */
  .icono-mic .cuerpo {
    fill: #4a3a1a;
  }

  /* icono cuadradito neón */
  .neon-box {
    width: 46px;
    height: 46px;
    background: #ff1744;
    border-radius: 4px;
    box-shadow:
      0 0 10px #ff1744,
      0 0 22px #ff1744,
      0 0 40px #ff4569,
      inset 0 0 8px rgba(255,255,255,0.5);
  }

  footer {
    margin-top: 56px;
    max-width: 640px;
    text-align: center;
    font-size: 1rem;
    color: #5c4a26;
    line-height: 1.5;
    padding: 0 10px 20px;
  }

  @media (max-width: 480px) {
    h1 { font-size: 2.2rem; }
    .tarjeta { width: 100%; max-width: 260px; }
  }
</style>
</head>
<body>

  <h1>SablewHUB</h1>
  <p class="subtitulo">De EasyFacilongo</p>

  <div class="tarjetas">

    <a class="tarjeta" href="https://grabadorasuperguapa.netlify.app/" target="_blank" rel="noopener">
      <div class="icono-wrap">
        <svg class="icono-mic" width="60" height="60" viewBox="0 0 24 24">
          <path class="cuerpo" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
          <path class="cuerpo" d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/>
        </svg>
      </div>
      <h2>Grabadora Super Guapa</h2>
    </a>

    <a class="tarjeta" href="https://sablew123.github.io/YourBestiary/" target="_blank" rel="noopener">
      <div class="icono-wrap">
        <svg width="70" height="70" viewBox="0 0 64 64">
          <g fill="#3a2e1a">
            <path d="M8 40c4-10 14-18 24-18 6 0 10 3 10 3s6-8 14-8c-2 6-6 9-6 9s6 2 6 8c-6-2-10-1-10-1s2 6-2 12c-2-4-6-6-6-6s-2 8-10 10c2-4 2-8 2-8s-8 2-14-1c4-2 6-6 6-6s-8 0-14-4z"/>
            <circle cx="46" cy="18" r="1.6" fill="#f4e9c8"/>
          </g>
        </svg>
      </div>
      <h2>YourBestiary</h2>
    </a>

    <a class="tarjeta" href="https://sablew123.github.io/BulletDasher/index.html" target="_blank" rel="noopener">
      <div class="icono-wrap">
        <div class="neon-box"></div>
      </div>
      <h2>BulletDasher</h2>
    </a>

  </div>

  <footer>
    todas las paginas hechas por EasyFacilongo bajo el nombre Sablew para todo el mundo, porque están hechas con IA, así que es gratis
  </footer>

</body>
</html>
